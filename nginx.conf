server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with long-lived cache headers.
    # Vite generates content-hashed filenames (e.g. assets/index-abc123.js),
    # so a 1-year max-age is safe – browsers will bust the cache automatically
    # whenever the content changes.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # All other requests fall back to index.html (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
